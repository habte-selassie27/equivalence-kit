name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install genvm-linter genlayer-test hypothesis
      - name: Primitives
        run: python -m pytest tests/primitives -q
      - name: Matrices
        run: python -m pytest tests/matrices -q
      - name: Cache GenVM artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: gltest-direct-v0.2.12
      # gltest 0.29.2 resolves "latest" to v0.3.0-rc7 and requests
      # genvm-universal.tar.xz, but that release renamed the asset to
      # genvm-runners-all.tar.xz, so the download 404s. Seed the cache with
      # v0.2.12, which still publishes genvm-universal.tar.xz and carries the
      # runner hash the contracts pin. The contract header still selects the
      # runner; only the archive location changes.
      - name: Fetch GenVM artifacts
        run: |
          if [ ! -f "$HOME/.cache/gltest-direct/genvm-universal-v0.2.12.tar.xz" ]; then
            mkdir -p "$HOME/.cache/gltest-direct"
            curl -fL --retry 3 --retry-delay 2 \
              -o "$HOME/.cache/gltest-direct/genvm-universal-v0.2.12.tar.xz" \
              https://github.com/genlayerlabs/genvm/releases/download/v0.2.12/genvm-universal.tar.xz
          fi
      - name: Direct
        run: python -m pytest tests/direct -q
      - name: Site data freshness + frontend registry parity
        run: |
          python tools/export_site_data.py --check
          python -m pytest tests/site -q
      - name: Lint contracts
        run: |
          for f in contracts/verdict_judge.py contracts/web_fact_attestor.py contracts/ranking_judge.py contracts/fixtures/consensus_probe.py; do
            genvm-lint check "$f" --json
          done
      - name: Vendor freshness
        run: python tools/vendor.py --check
      - name: Mutation testing
        run: python tools/mutation.py --pattern P1 --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Package sync (public/pkg)
        run: npm run sync:pkg
        working-directory: frontend
      - name: Typecheck + unit tests
        run: |
          npx tsc --noEmit
          npx vitest run
        working-directory: frontend
      - name: Production build
        run: npx vite build
        working-directory: frontend
